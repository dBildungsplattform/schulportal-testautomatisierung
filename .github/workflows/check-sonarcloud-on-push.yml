name: "Check with Sonarcloud"

on:
  push:

concurrency:
  group: schulportal-testautomatisierung-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/check-nest-test-sonarcloud.yaml@fccc51d8fe32bb28e8027d72afac0e5e03871c2f
    with:
      node_version: '18'
      skip_tests: true
    permissions:
      contents: read
    secrets: inherit
#      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}